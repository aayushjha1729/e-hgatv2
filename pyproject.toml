[project]
name = "ehgat"
version = "0.1.0"
description = "E-HGATv2: Explainable Heterogeneous GATv2-guided NSGA-II for energy-efficient SA-AGV container-terminal scheduling"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Aayush Jha" }]
keywords = [
    "explainable-ai",
    "graph-neural-networks",
    "nsga-ii",
    "scheduling",
    "container-terminal",
    "multi-objective-optimization",
]

dependencies = [
    "numpy>=1.26,<3.0",
    "scipy>=1.11",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "rich>=13.7",
]

[project.optional-dependencies]
# Heavy numerical / learning stack. Kept separate so the environment + oracle
# (Phase 1) and BRKGA (Phase 2) can be developed and tested without Torch.
learn = [
    "torch>=2.2",
    "torch-geometric>=2.5",
    "xgboost>=2.0",
    "shap>=0.45",
    "scikit-learn>=1.4",
]
viz = [
    "matplotlib>=3.8",
    "pymoo>=0.6.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ehgat"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["N803", "N806"]  # allow math-style single-cap var names (x_i, C_max, etc.)

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802", "N806"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["ehgat"]

[[tool.mypy.overrides]]
module = ["torch", "torch.*", "torch_geometric.*", "xgboost.*", "shap.*", "pymoo.*", "sklearn.*", "scipy", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
markers = [
    "slow: long-running tests (oracle enumeration, GNN training)",
    "learn: requires the optional 'learn' (torch) extra",
]

[tool.coverage.run]
branch = true
source = ["src/ehgat"]

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
